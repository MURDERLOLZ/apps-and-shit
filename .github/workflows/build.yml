name: Build SwiftCord

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile with swiftc
        run: |
          swiftc -parse-as-library Sources/*.swift \
            -target arm64-apple-ios16.0 \
            -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
            -framework SwiftUI -framework WebKit -framework UIKit -framework Foundation \
            -o SwiftCord

      - name: Package IPA
        run: |
          mkdir -p Payload/SwiftCord.app
          mv SwiftCord Payload/SwiftCord.app/
          cp Info.plist Payload/SwiftCord.app/
          zip -r SwiftCord.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwiftCord-IPA
          path: SwiftCord.ipa
